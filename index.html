<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極分組抽籤系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* 玻璃擬態卡片風格 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 正在抽籤時的發光閃爍效果 */
        .rolling-card {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            animation: pulse-glow 0.5s infinite alternate;
            transform: scale(1.05);
            transition: all 0.2s ease;
        }

        /* 鎖定（抽中）時的特效 */
        .locked-card {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
            transform: scale(1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
            to { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }

        .name-item {
            animation: fade-in 0.3s ease-out forwards;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 隱藏捲動條但保留功能 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 bg-gradient-to-br from-slate-900 via-gray-900 to-black">

    <!-- 慶祝紙片畫布 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 階段一：輸入區 -->
    <div id="setup-screen" class="w-full max-w-2xl glass-card rounded-2xl p-6 sm:p-10 shadow-2xl transition-all duration-500">
        <div class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 tracking-wider">
                ⚡ 終極分組抽籤 ⚡
            </h1>
            <p class="text-slate-400">自動將名單均勻分配至 6 個組別，體驗心跳加速的揭曉時刻！</p>
        </div>

        <div class="mb-6 relative">
            <label for="names-input" class="block text-sm font-bold text-slate-300 mb-2">輸入名單 (每行一個名字，或用逗號隔開)：</label>
            <textarea id="names-input" rows="8" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none text-lg" placeholder="例如：&#10;王小明&#10;陳大牛&#10;林美玲&#10;..."></textarea>
            
            <div id="error-msg" class="hidden absolute -bottom-8 left-0 text-red-400 text-sm font-bold flex items-center">
                <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span>請至少輸入一個名字！</span>
            </div>
        </div>

        <button id="start-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xl py-4 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.5)] hover:shadow-[0_0_25px_rgba(59,130,246,0.7)] transform hover:-translate-y-1 transition-all duration-200 active:scale-95">
            開始分組抽籤
        </button>
    </div>

    <!-- 階段二：抽籤展示區 -->
    <div id="draw-screen" class="w-full max-w-6xl hidden flex-col items-center opacity-0 transition-opacity duration-1000">
        <h2 id="status-title" class="text-3xl sm:text-4xl font-black mb-8 text-center text-amber-400 tracking-widest drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]">
            準備開始...
        </h2>

        <!-- 6個組別的網格 -->
        <div id="groups-container" class="grid grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6 w-full">
            <!-- 卡片會由 JS 動態產生 -->
        </div>

        <button id="restart-btn" class="mt-10 hidden bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-full transition-all duration-200 shadow-lg">
            重新抽籤
        </button>
    </div>

    <script>
        // DOM 元素
        const setupScreen = document.getElementById('setup-screen');
        const drawScreen = document.getElementById('draw-screen');
        const namesInput = document.getElementById('names-input');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const errorMsg = document.getElementById('error-msg');
        const groupsContainer = document.getElementById('groups-container');
        const statusTitle = document.getElementById('status-title');

        // 狀態變數
        const NUM_GROUPS = 6;
        let originalNames = [];
        let finalGroups = [];
        let currentGroupIndex = 0;
        let isDrawing = false;
        
        // Web Audio API (用於製造緊張音效)
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 短促的滴答聲 (滾動時)
        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // 沉重的鎖定聲 (確定組別時)
        function playLockSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // 歡呼/完成音效
        function playSuccessSound() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
                
                osc.start(audioCtx.currentTime + index * 0.1);
                osc.stop(audioCtx.currentTime + index * 0.1 + 0.3);
            });
        }

        // 解析並洗牌名單
        function processNames() {
            const rawText = namesInput.value;
            // 支援換行或逗號分隔，過濾空白
            originalNames = rawText.split(/[\n,]+/)
                                   .map(name => name.trim())
                                   .filter(name => name.length > 0);
            
            if (originalNames.length === 0) {
                errorMsg.classList.remove('hidden');
                return false;
            }
            errorMsg.classList.add('hidden');

            // Fisher-Yates 洗牌演算法
            let shuffled = [...originalNames];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // 平均分配到 6 個組別
            finalGroups = Array.from({length: NUM_GROUPS}, () => []);
            shuffled.forEach((name, index) => {
                finalGroups[index % NUM_GROUPS].push(name);
            });

            return true;
        }

        // 初始化卡片 UI
        function createGroupCards() {
            groupsContainer.innerHTML = '';
            for (let i = 0; i < NUM_GROUPS; i++) {
                const card = document.createElement('div');
                card.id = `group-card-${i}`;
                card.className = 'glass-card rounded-xl p-4 sm:p-6 flex flex-col h-48 sm:h-64 overflow-hidden relative';
                
                const title = document.createElement('h3');
                title.className = 'text-xl sm:text-2xl font-black text-slate-200 mb-3 text-center border-b border-slate-600 pb-2';
                title.textContent = `第 ${i + 1} 組`;
                
                const membersContainer = document.createElement('div');
                membersContainer.id = `group-members-${i}`;
                membersContainer.className = 'flex-1 overflow-y-auto flex flex-col gap-2 items-center justify-center';
                
                // 預設問號
                const placeholder = document.createElement('span');
                placeholder.className = 'text-4xl text-slate-600 opacity-50 font-black';
                placeholder.textContent = '?';
                membersContainer.appendChild(placeholder);

                card.appendChild(title);
                card.appendChild(membersContainer);
                groupsContainer.appendChild(card);
            }
        }

        // 渲染指定組別內的名字
        function renderNamesInCard(groupIndex, namesList, isRolling) {
            const container = document.getElementById(`group-members-${groupIndex}`);
            container.innerHTML = '';
            
            if (namesList.length === 0) {
                container.innerHTML = '<span class="text-slate-500 italic">無人</span>';
                return;
            }

            namesList.forEach(name => {
                const span = document.createElement('span');
                span.className = `font-bold text-lg sm:text-xl text-center w-full truncate ${isRolling ? 'text-slate-400 blur-[1px]' : 'text-white name-item'}`;
                span.textContent = name;
                container.appendChild(span);
            });
        }

        // 核心動畫控制：逐組開獎
        function startDrawingSequence() {
            currentGroupIndex = 0;
            isDrawing = true;
            restartBtn.classList.add('hidden');
            
            // 進入下一組的遞迴函數
            function animateNextGroup() {
                if (currentGroupIndex >= NUM_GROUPS) {
                    finishDrawing();
                    return;
                }

                const card = document.getElementById(`group-card-${currentGroupIndex}`);
                statusTitle.textContent = `⚡ 正在抽出 第 ${currentGroupIndex + 1} 組 ⚡`;
                card.classList.add('rolling-card');

                const targetNames = finalGroups[currentGroupIndex];
                let ticks = 0;
                const maxTicks = 25; // 每次動畫約 25 次變換 (營造緊張感)
                const tickInterval = 80; // 毫秒

                const rollInterval = setInterval(() => {
                    ticks++;
                    playTick();
                    
                    // 隨機顯示名字產生「滾動」錯覺
                    let dummyNames = [];
                    for(let i=0; i<targetNames.length; i++) {
                        dummyNames.push(originalNames[Math.floor(Math.random() * originalNames.length)]);
                    }
                    renderNamesInCard(currentGroupIndex, dummyNames, true);

                    // 停止滾動，鎖定結果
                    if (ticks >= maxTicks) {
                        clearInterval(rollInterval);
                        
                        playLockSound();
                        card.classList.remove('rolling-card');
                        card.classList.add('locked-card');
                        renderNamesInCard(currentGroupIndex, targetNames, false);
                        
                        currentGroupIndex++;
                        
                        // 稍微停頓後，繼續下一組 (1秒)
                        setTimeout(animateNextGroup, 1000);
                    }
                }, tickInterval);
            }

            // 開始第一組
            animateNextGroup();
        }

        function finishDrawing() {
            isDrawing = false;
            statusTitle.innerHTML = '🎉 分組完成！ 🎉';
            statusTitle.className = 'text-4xl sm:text-5xl font-black mb-8 text-center text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 tracking-widest drop-shadow-[0_0_15px_rgba(74,222,128,0.5)]';
            playSuccessSound();
            fireConfetti();
            restartBtn.classList.remove('hidden');
        }

        // 事件監聽
        startBtn.addEventListener('click', () => {
            if (isDrawing) return;
            initAudio(); // 初始化音效
            
            if (processNames()) {
                // 隱藏設定區，顯示抽籤區
                setupScreen.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'absolute');
                setTimeout(() => {
                    setupScreen.classList.add('hidden');
                    drawScreen.classList.remove('hidden');
                    createGroupCards();
                    
                    // 淡入抽籤區並開始
                    setTimeout(() => {
                        drawScreen.classList.remove('opacity-0');
                        setTimeout(startDrawingSequence, 500); // 給予視覺緩衝後開始
                    }, 50);
                }, 300);
            }
        });

        restartBtn.addEventListener('click', () => {
            // 重置 UI
            drawScreen.classList.add('opacity-0');
            statusTitle.className = 'text-3xl sm:text-4xl font-black mb-8 text-center text-amber-400 tracking-widest drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]';
            statusTitle.textContent = '準備開始...';
            
            setTimeout(() => {
                drawScreen.classList.add('hidden');
                setupScreen.classList.remove('hidden', 'absolute', 'pointer-events-none');
                setTimeout(() => {
                    setupScreen.classList.remove('opacity-0', 'scale-95');
                }, 50);
            }, 500);
        });

        // 簡單的 Canvas 紙片慶祝特效
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let confettiActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            particles = [];
            confettiActive = true;
            const colors = ['#fde047', '#3b82f6', '#ef4444', '#22c55e', '#a855f7'];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            if (!confettiActive) return;
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let activeParticles = 0;
            particles.forEach(p => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2; // 重力
                p.y += p.dy;
                p.x += p.dx;
                
                if (p.y <= canvas.height) activeParticles++;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();
            });

            if (activeParticles === 0) confettiActive = false;
        }
    </script>
</body>
</html>
