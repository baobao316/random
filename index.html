<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極分組抽籤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center py-12 px-4 overflow-x-hidden relative">

    <!-- 漂浮背景裝飾 -->
    <div class="fixed top-20 left-20 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 pointer-events-none"></div>
    <div class="fixed bottom-20 right-20 w-64 h-64 bg-purple-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 pointer-events-none"></div>

    <h1 class="text-4xl sm:text-5xl font-black mb-10 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 drop-shadow-lg z-10">
        🎲 終極分組抽籤
    </h1>

    <!-- 階段一：名單輸入 -->
    <div id="setup-screen" class="w-full max-w-2xl glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl transition-all duration-500 z-10">
        
        <!-- 新增自訂組數欄位 -->
        <div class="mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-800/80 border border-slate-600 rounded-xl p-4 gap-4">
            <label for="group-count" class="text-lg font-bold text-slate-300">請設定預計分成幾組：</label>
            <div class="flex items-center gap-2">
                <input type="number" id="group-count" value="6" min="2" max="100" class="w-24 bg-slate-900 text-white text-center font-bold text-xl rounded-lg py-2 border border-slate-500 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                <span class="text-slate-400 font-bold">組</span>
            </div>
        </div>

        <label for="names-input" class="block text-lg font-bold mb-3 text-slate-300">請貼上參與者名單 (每行一個名字或用逗號分隔)：</label>
        <textarea id="names-input" rows="8" class="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow text-lg resize-none mb-4" placeholder="例如：
王大明
陳小美
張三
李四..."></textarea>
        
        <p id="error-msg" class="text-red-400 text-sm mb-4 hidden font-bold">⚠️ 請至少輸入一個名字才能開始！</p>
        
        <button id="start-btn" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-black text-xl py-4 rounded-xl transition-all shadow-[0_0_15px_rgba(37,99,235,0.5)] transform hover:-translate-y-1 active:scale-95">
            🚀 開始進行分組！
        </button>
    </div>

    <!-- 階段二：抽籤動畫區塊 -->
    <div id="draw-screen" class="w-full max-w-5xl hidden flex-col items-center absolute top-32 left-1/2 transform -translate-x-1/2 opacity-0 transition-opacity duration-500 z-10">
        <h2 id="status-title" class="text-3xl sm:text-4xl font-black mb-8 text-center text-amber-400 tracking-widest drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]">
            準備開始...
        </h2>
        
        <!-- 6組卡片容器 -->
        <div id="groups-container" class="grid grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6 w-full px-4">
            <!-- 由 JS 動態產生 6 張玻璃卡片 -->
        </div>
    </div>

    <!-- 階段三：簡單乾淨的結果列表 -->
    <div id="result-screen" class="w-full max-w-3xl hidden flex-col items-center opacity-0 transition-opacity duration-1000 z-10">
        <div class="w-full bg-white rounded-2xl shadow-2xl p-6 sm:p-10 text-slate-800">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b-2 border-slate-100 pb-6 gap-4">
                <h3 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                    <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    分組結果全覽
                </h3>
                <button id="copy-excel-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all flex items-center gap-2 transform hover:-translate-y-1 active:scale-95">
                    📋 複製名單 (一人一格直列)
                </button>
            </div>
            
            <div id="simple-list-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- 最終簡單列表由 JS 產生 -->
            </div>
            
            <div class="mt-10 flex justify-center pt-6 border-t border-slate-100">
                <button id="restart-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-8 rounded-xl transition-all">
                    返回重新抽籤
                </button>
            </div>
        </div>
    </div>

    <!-- 慶祝彩帶 Canvas -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>

    <script>
        // 核心設定：將常數改為變數，以接收自訂數量
        let numGroups = 6;
        let finalGroups = [];
        let audioCtx = null;
        let isDrawing = false;

        // DOM 元素綁定
        const setupScreen = document.getElementById('setup-screen');
        const drawScreen = document.getElementById('draw-screen');
        const resultScreen = document.getElementById('result-screen');
        const groupCountInput = document.getElementById('group-count');
        const namesInput = document.getElementById('names-input');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const copyExcelBtn = document.getElementById('copy-excel-btn');
        const errorMsg = document.getElementById('error-msg');
        const groupsContainer = document.getElementById('groups-container');
        const simpleListContainer = document.getElementById('simple-list-container');
        const statusTitle = document.getElementById('status-title');
        const confettiCanvas = document.getElementById('confetti-canvas');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playSuccess() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            const text = namesInput.value.trim();
            if (!text) {
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');

            // 讀取使用者設定的組數
            numGroups = parseInt(groupCountInput.value) || 6;
            if (numGroups < 2) numGroups = 2; // 防呆機制，最少分兩組

            let names = text.split(/[\n,、\t]+/).map(n => n.trim()).filter(n => n);
            if (names.length === 0) return;

            // 1. 隨機打亂參與者名單
            shuffleArray(names);
            
            // 2. 建立隨機的「組別發牌順序」，確保多出的人隨機分到任一組
            let groupOrder = Array.from({ length: numGroups }, (_, i) => i);
            shuffleArray(groupOrder); // 把組別順序也打亂！

            // 3. 準備空陣列並開始發牌
            finalGroups = Array.from({ length: numGroups }, () => []);
            names.forEach((name, i) => {
                // 依照打亂的組別順序來分配名單
                let targetGroup = groupOrder[i % numGroups];
                finalGroups[targetGroup].push(name);
            });

            // 建立對應數量的抽籤卡片
            groupsContainer.innerHTML = '';
            for (let i = 0; i < numGroups; i++) {
                groupsContainer.innerHTML += `
                    <div id="group-card-${i}" class="glass-panel rounded-xl p-4 sm:p-6 shadow-xl transform transition-all duration-200">
                        <h3 class="text-lg font-bold text-slate-400 mb-3 border-b border-slate-600/50 pb-2">第 ${i + 1} 組</h3>
                        <div id="group-content-${i}" class="text-3xl sm:text-4xl font-black text-amber-500 flex items-center justify-center h-20 tracking-widest drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]">
                            ?
                        </div>
                    </div>
                `;
            }

            // 切換畫面
            setupScreen.classList.add('opacity-0');
            setTimeout(() => {
                setupScreen.classList.add('hidden', 'absolute');
                drawScreen.classList.remove('hidden');
                setTimeout(() => {
                    drawScreen.classList.remove('opacity-0');
                    setTimeout(startFastDrawing, 300);
                }, 50);
            }, 500);
        });

        function startFastDrawing() {
            isDrawing = true;
            let currentGroupIndex = 0;
            statusTitle.textContent = '🚀 緊張分組中...';

            function drawNextGroup() {
                // 判斷是否全部自訂組別皆開獎完畢
                if (currentGroupIndex >= numGroups) {
                    finishDrawing();
                    return;
                }

                const card = document.getElementById(`group-card-${currentGroupIndex}`);
                const content = document.getElementById(`group-content-${currentGroupIndex}`);
                const targetNames = finalGroups[currentGroupIndex];
                const allNames = finalGroups.flat();
                
                let ticks = 0;
                // 減少 tick 次數與間隔，讓每組只要約 0.8 秒就開獎
                const maxTicks = 12; 
                const tickInterval = 60; 

                const rollInterval = setInterval(() => {
                    ticks++;
                    playTick();
                    
                    // 隨機名字閃爍殘影
                    let randomName = allNames[Math.floor(Math.random() * allNames.length)];
                    content.innerHTML = `<span class="opacity-50 blur-[1px] text-2xl">${randomName}</span>`;
                    
                    // 卡片微震動
                    card.style.transform = `translateY(${Math.random() * 4 - 2}px)`;

                    if (ticks >= maxTicks) {
                        clearInterval(rollInterval);
                        playSuccess();
                        
                        // 鎖定結果樣式
                        card.style.transform = 'translateY(0) scale(1.05)';
                        card.classList.remove('glass-panel');
                        card.classList.add('bg-blue-900/60', 'border-blue-400', 'shadow-[0_0_15px_rgba(96,165,250,0.5)]');
                        
                        // 顯示真實名單
                        content.innerHTML = `<div class="text-blue-100 text-lg sm:text-xl font-bold tracking-normal drop-shadow-[0_0_8px_rgba(147,197,253,0.8)] flex flex-wrap justify-center gap-1.5 leading-tight">${targetNames.join(', ')}</div>`;
                        
                        setTimeout(() => card.style.transform = 'translateY(0) scale(1)', 150);

                        currentGroupIndex++;
                        // 開獎後只停頓 0.5 秒就抽下一組
                        setTimeout(drawNextGroup, 500);
                    }
                }, tickInterval);
            }

            // 開始高速抽第一組
            drawNextGroup();
        }

        function finishDrawing() {
            isDrawing = false;
            statusTitle.textContent = '🎉 分組完成！';
            statusTitle.className = 'text-4xl sm:text-5xl font-black mb-8 text-center text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 tracking-widest drop-shadow-[0_0_15px_rgba(74,222,128,0.5)]';
            fireConfetti();
            
            // 等待 1.5 秒讓大家看完結果後，轉場到乾淨列表
            setTimeout(() => {
                drawScreen.classList.add('opacity-0');
                setTimeout(() => {
                    drawScreen.classList.add('hidden');
                    renderSimpleList();
                    resultScreen.classList.remove('hidden');
                    setTimeout(() => {
                        resultScreen.classList.remove('opacity-0');
                    }, 50);
                }, 500);
            }, 1500);
        }

        function renderSimpleList() {
            simpleListContainer.innerHTML = '';
            // 依據動態組數生成表格清單
            for (let i = 0; i < numGroups; i++) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'bg-slate-50 border border-slate-200 rounded-xl p-4';
                
                const title = document.createElement('h4');
                title.className = 'font-black text-lg text-emerald-700 border-b-2 border-emerald-200 pb-2 mb-3';
                title.textContent = `第 ${i + 1} 組`;
                groupDiv.appendChild(title);

                const list = document.createElement('div');
                list.className = 'flex flex-col gap-2';
                
                finalGroups[i].forEach(name => {
                    const item = document.createElement('div');
                    item.className = 'bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-100 text-slate-700 font-bold';
                    item.textContent = name;
                    list.appendChild(item);
                });

                groupDiv.appendChild(list);
                simpleListContainer.appendChild(groupDiv);
            }
        }

        copyExcelBtn.addEventListener('click', () => {
            let excelData = '';
            // 依據動態組數準備 Excel 資料
            for (let i = 0; i < numGroups; i++) {
                // 加入組別標題
                excelData += `[ 第 ${i + 1} 組 ]\n`;
                // 逐行加入名字 (一人一列)
                finalGroups[i].forEach(name => {
                    excelData += `${name}\n`;
                });
                // 兩組之間空一行方便閱讀 (可選，這裡加上確保不擁擠)
                excelData += '\n'; 
            }

            // 建立暫存區塊以複製文字
            const textarea = document.createElement('textarea');
            textarea.value = excelData.trim();
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                // 按鈕特效反饋
                const originalHTML = copyExcelBtn.innerHTML;
                copyExcelBtn.innerHTML = '✅ 已成功複製！請至 Excel 貼上';
                copyExcelBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                
                setTimeout(() => {
                    copyExcelBtn.innerHTML = originalHTML;
                    copyExcelBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                }, 3000);
            } catch (err) {
                alert('複製失敗，請手動圈選文字複製。');
            }
            
            document.body.removeChild(textarea);
        });

        restartBtn.addEventListener('click', () => {
            resultScreen.classList.add('opacity-0');
            statusTitle.className = 'text-3xl sm:text-4xl font-black mb-8 text-center text-amber-400 tracking-widest drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]';
            statusTitle.textContent = '準備開始...';
            
            setTimeout(() => {
                resultScreen.classList.add('hidden');
                setupScreen.classList.remove('hidden', 'absolute');
                setTimeout(() => {
                    setupScreen.classList.remove('opacity-0');
                }, 50);
            }, 500);
        });

        // 簡單彩帶特效 (Canvas)
        function fireConfetti() {
            confettiCanvas.classList.remove('hidden');
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#4ade80', '#60a5fa'];
            
            for(let i=0; i<100; i++) {
                particles.push({
                    x: confettiCanvas.width / 2,
                    y: confettiCanvas.height / 2 + 100,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10
                });
            }

            let animationId;
            function render() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let active = false;
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // 重力
                    p.rot += p.rotSpeed;
                    
                    if(p.y < confettiCanvas.height) active = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                });

                if(active) {
                    animationId = requestAnimationFrame(render);
                } else {
                    confettiCanvas.classList.add('hidden');
                }
            }
            render();
        }
    </script>
</body>
</html>
